# dsh-android-emulator — Android 模拟器测试工具（Host 插件，零依赖）
#
# 插一行全局行：这些工具在任何模式/会话里都该可用（它测的是"外部世界的安卓设备"，
# 与当前 agent 处于哪个 preset 无关），而且插件不注册任何界面，没有 UI 半。
#
# 配置可写在这一行下面（全部可选）：
#   sdkPath: '%LOCALAPPDATA%\Android\Sdk'   # 省略则自动发现
#   avdName: 'dsh_android'
#   outputDir: ''                            # 省略 → <tmp>/dsh-android-emulator
#   bootTimeoutMs: 240000
#   emulatorArgs: []
#   adbPath: ''
#   emulatorPath: ''
#   perSession: true                         # v1.2.0：每会话独立模拟器
#   maxInstances: 2                          # v1.2.0：同时运行的实例上限（1–8），保护磁盘
#   avdNamePrefix: ''                        # v1.2.0：会话专属 AVD 名前缀，空则用 avdName
#   onDemand: true                           # v1.3.0：按需门控（默认开）——15 个 android_* 工具
#                                            #   平时不进模型工具表，模型加载本插件自带的
#                                            #   `android-emulator` skill 后从下一步出现。
#                                            #   设 false = 常驻（工具永远可见，1.2.x 的老行为）。
#                                            #   没有 skill 工具的模式（minimal 等）自动 fail-open，
#                                            #   保持常驻，不受本项影响。
- insert:
    - id: android-emulator
      name: 'dsh-android-emulator'
